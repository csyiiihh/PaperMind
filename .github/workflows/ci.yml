
name: PaperMind CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: papermind_pytest_db
          MYSQL_USER: papermind_tester
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: papermind_tester
      DB_PASSWORD: ci-test-password
      DB_NAME: papermind_pytest_db
      PAPERMIND_TEST_DB_PASSWORD: ci-test-password
      PAPERMIND_TESTING: "1"
      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-for-production
      DEEPSEEK_API_KEY: ci-dummy-key-not-a-real-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-paraphrase-multilingual-minilm-l12-v2

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt


      - name: Create migration database
        run: |
          python - <<'PY'
          import pymysql

          connection = pymysql.connect(
              host="127.0.0.1",
              port=3306,
              user="root",
              password="ci-root-password",
              autocommit=True,
          )

          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "CREATE DATABASE papermind_migration_ci "
                      "CHARACTER SET utf8mb4 "
                      "COLLATE utf8mb4_unicode_ci"
                  )
              print("Migration database created.")
          finally:
              connection.close()
          PY

      - name: Validate Alembic migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: papermind_migration_ci
          PAPERMIND_TESTING: "0"
        run: |
          alembic upgrade head
          alembic current
          alembic check

          python - <<'PY'
          import pymysql

          connection = pymysql.connect(
              host="127.0.0.1",
              port=3306,
              user="root",
              password="ci-root-password",
              database="papermind_migration_ci",
          )

          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT version_num FROM alembic_version"
                  )
                  versions = [
                      row[0] for row in cursor.fetchall()
                  ]

                  assert len(versions) == 1, (
                      f"Expected one migration version, got {versions}"
                  )

                  cursor.execute("SHOW TABLES")
                  tables = {
                      row[0] for row in cursor.fetchall()
                  }

                  expected = {
                      "alembic_version",
                      "users",
                      "papers",
                      "chat_messages",
                      "message_sources",
                  }

                  missing = expected - tables

                  assert not missing, (
                      f"Missing database tables: {sorted(missing)}"
                  )

                  print("Migration version:", versions[0])
                  print("Verified tables:", ", ".join(sorted(expected)))
                  print("Alembic migration validation passed.")
          finally:
              connection.close()
          PY

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
